[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not stress'"
markers = [
    "stress: opt-in load, soak, chaos, and concurrency verification",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["simulation_tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F401", "F821"]
ignore = ["E722", "E731"]

[tool.mypy]
python_version = "3.11"
files = ["simulation", "dashboard"]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
